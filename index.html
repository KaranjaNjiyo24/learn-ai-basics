<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shamba Bora</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="intro" hidden>
  <svg viewBox="0 0 120 200" width="160" height="260" role="img" aria-label="Sugarcane stalks growing from shoots to full height">
    <g id="cane" fill="#008000">
      <!-- three stalks of different heights, each with white joints -->
      <rect x="36" y="70" width="9" height="120"/>
      <rect x="56" y="30" width="9" height="160"/>
      <rect x="76" y="55" width="9" height="135"/>
      <g fill="#FFFFFF">
        <rect class="node" x="36" y="100" width="9" height="2"/>
        <rect class="node" x="36" y="135" width="9" height="2"/>
        <rect class="node" x="36" y="165" width="9" height="2"/>
        <rect class="node" x="56" y="60" width="9" height="2"/>
        <rect class="node" x="56" y="95" width="9" height="2"/>
        <rect class="node" x="56" y="130" width="9" height="2"/>
        <rect class="node" x="56" y="165" width="9" height="2"/>
        <rect class="node" x="76" y="85" width="9" height="2"/>
        <rect class="node" x="76" y="120" width="9" height="2"/>
        <rect class="node" x="76" y="155" width="9" height="2"/>
      </g>
      <!-- long arching leaf blades -->
      <path class="leaf" d="M60 30 Q40 6 6 22 Q38 16 58 38 Z"/>
      <path class="leaf" d="M62 30 Q82 6 114 22 Q84 16 64 38 Z"/>
      <path class="leaf" d="M40 70 Q22 50 2 66 Q24 58 38 78 Z"/>
      <path class="leaf" d="M81 55 Q98 35 118 50 Q96 44 83 63 Z"/>
    </g>
  </svg>
  <div id="intro-fact" hidden>
    <h2>Did you know?</h2>
    <p id="intro-text"></p>
    <p class="label" id="intro-source"></p>
    <button type="button" id="intro-close">Continue to my farm</button>
  </div>
</div>
<main>
  <header>
    <h1>Shamba Bora</h1>
    <p>Know what to expect from your sugarcane before harvest.</p>
  </header>

  <form id="farm-form" novalidate>
    <h2>Your farm</h2>

    <label for="acres">Acres of cane</label>
    <input id="acres" name="acres" type="number" inputmode="decimal" step="any">
    <p class="field-message" id="acres-msg" role="alert"></p>

    <label for="variety">Cane variety</label>
    <input id="variety" name="variety" type="text" autocomplete="off">
    <p class="field-message" id="variety-msg" role="alert"></p>

    <label for="plantingDate">When did you plant?</label>
    <input id="plantingDate" name="plantingDate" type="date">
    <p class="field-message" id="plantingDate-msg" role="alert"></p>

    <label for="place">Where is your farm? (nearest town or place)</label>
    <input id="place" name="place" type="text" autocomplete="off">
    <button type="button" id="use-location" class="secondary">Use my location</button>
    <p class="field-message" id="place-msg" role="alert"></p>

    <h2>Your soil report</h2>

    <label for="ph">pH</label>
    <input id="ph" name="ph" type="number" inputmode="decimal" step="any">
    <p class="field-message" id="ph-msg" role="alert"></p>

    <label for="n">Nitrogen</label>
    <input id="n" name="n" type="number" inputmode="decimal" step="any">
    <p class="field-message" id="n-msg" role="alert"></p>

    <label for="p">Phosphorus</label>
    <input id="p" name="p" type="number" inputmode="decimal" step="any">
    <p class="field-message" id="p-msg" role="alert"></p>

    <label for="k">Potassium</label>
    <input id="k" name="k" type="number" inputmode="decimal" step="any">
    <p class="field-message" id="k-msg" role="alert"></p>

    <details id="money-section">
      <summary>Money (optional)</summary>
      <p>Not needed for your estimate. Add prices to see what the harvest could earn.</p>

      <label for="newPrice">New season price per tonne (Ksh)</label>
      <input id="newPrice" name="newPrice" type="number" inputmode="decimal" step="any">
      <p class="field-message" id="newPrice-msg" role="alert"></p>

      <label for="lastPrice">Price per tonne you were paid last season (Ksh)</label>
      <input id="lastPrice" name="lastPrice" type="number" inputmode="decimal" step="any">
      <p class="field-message" id="lastPrice-msg" role="alert"></p>

      <label for="lastSpending">Last year's spending on the farm (Ksh)</label>
      <input id="lastSpending" name="lastSpending" type="number" inputmode="decimal" step="any">
      <p class="field-message" id="lastSpending-msg" role="alert"></p>
    </details>

    <div id="confirm-box" class="confirm" hidden>
      <p id="confirm-text"></p>
      <button type="button" id="confirm-yes">Yes, it is correct</button>
      <button type="button" id="confirm-fix" class="secondary">Let me fix it</button>
    </div>

    <div id="weather-box" class="confirm" hidden>
      <p id="weather-text"></p>
      <button type="button" id="weather-retry">Try again</button>
      <button type="button" id="weather-continue" class="secondary">Continue with typical conditions</button>
    </div>

    <button type="submit" id="estimate-btn">Show my estimate</button>
    <p id="status" role="status"></p>
  </form>

  <section id="result" hidden>
    <h2>Your estimate</h2>
    <p class="big" id="result-per-acre"></p>
    <p id="result-total"></p>
    <p id="result-note"></p>
    <div id="result-money"></div>
    <p class="label" id="result-label"></p>
    <details>
      <summary>How this was worked out</summary>
      <div id="result-detail"></div>
    </details>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
